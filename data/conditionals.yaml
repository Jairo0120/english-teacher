  - {type: 3, level: B2, tag: wrong_main_tense, wrong: "If you had told me, I would help you.", en: "If you had told me, I would have helped you."}
  - {type: 4, level: B2, tag: will_with_past, wrong: "If I had studied medicine, I will be a doctor now.", en: "If I had studied medicine, I would be a doctor now."}
