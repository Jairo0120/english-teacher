# A situation to rewrite as one conditional sentence
transform:
  - {type: 3, level: B1, situation: "I didn't set an alarm, so I woke up late.", en: "If I had set an alarm, I wouldn't have woken up late."}
  - {type: 2, level: B1, situation: "I don't have a car, so I can't drive to work.", en: "If I had a car, I could drive to work."}
  - {type: 3, level: B1, situation: "She didn't study, so she failed the exam.", en: "If she had studied, she wouldn't have failed the exam."}
  - {type: 3, level: B1, situation: "He missed the bus because he left home late.", en: "If he hadn't left home late, he wouldn't have missed the bus."}
  - {type: 1, level: B1, situation: "Maybe it will be sunny tomorrow. In that case, we'll have a picnic.", en: "If it's sunny tomorrow, we'll have a picnic."}
  - {type: 2, level: B2, situation: "It's raining, so we can't play football.", en: "If it weren't raining, we could play football."}
  - {type: 4, level: B2, situation: "I didn't save money last year, so I can't go on holiday now.", en: "If I had saved money last year, I could go on holiday now."}
  - {type: 4, level: B2, situation: "I didn't learn to swim as a child, so I'm afraid of the sea now.", en: "If I had learned to swim as a child, I wouldn't be afraid of the sea now."}
  - {type: 3, level: C1, situation: "I didn't know about the problem, so I didn't help.", en: "Had I known about the problem, I would have helped."}

# Shown with the correct version after two failed attempts (fixed text: the model's rules weren't reliable)
rules:
  1: "Real o posible: if + presente, will / can / imperativo (o presente, si es algo que siempre ocurre). Nunca will en la parte del if."
  2: "Hipotético en presente o futuro: if + pasado simple (were para todas las personas, aunque was se acepta), would / could / might + verbo, sin to."
  3: "Pasado irreal: if + had + participio, would / could / might have + participio. Nunca would en la parte del if; ojo con los participios irregulares (known, come, gone)."
  4: "Mixto: if + had + participio (pasado que no ocurrió), would + verbo (resultado ahora). También al revés: if + pasado simple, would have + participio."
