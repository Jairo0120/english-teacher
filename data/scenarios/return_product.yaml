title: Devolver un producto defectuoso
name: Store assistant
character: A customer service assistant at an electronics store. Follows the rules and is not very flexible.
voice: af_nicole
student_role: A customer who bought wireless headphones ten days ago.
setting: You bought expensive wireless headphones at this store ten days ago. The left earphone stopped working yesterday. You don't have the paper receipt, but you paid by card.
goal: Get a full refund, not just store credit or a repair.
twists:
  - The assistant says the store's return policy is only seven days.
  - The assistant offers a repair that would take three weeks.
